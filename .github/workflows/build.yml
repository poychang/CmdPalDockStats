name: Build and test
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/CmdPalDockStats.slnx --locked-mode
      - run: dotnet build src/CmdPalDockStats.slnx -p:Platform=x64 --no-restore
      - run: dotnet test tests/CmdPalDockStats.Tests --no-restore
      - run: dotnet test tests/CmdPalDockStats.IntegrationTests --no-restore --filter "TestCategory!=Hardware"